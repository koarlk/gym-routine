<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#08090d">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #08090d;
    --card: #101219;
    --card-2: #171a24;
    --raise: #1e2230;
    --hair: rgba(255, 255, 255, .065);
    --hair-strong: rgba(255, 255, 255, .1);
    --text: #f2f4f8;
    --muted: #878da1;
    --dim: #596077;
    --accent: #ccff4d;
    --accent-2: #7ff2ae;
    --accent-soft: rgba(204, 255, 77, .13);
    --ink: #101a00;
    --danger: #ff6b7a;
    /* Bewegungsachse. Das Blau ist gegenueber dem gewuenschten #005a9e
       aufgehellt (gleicher Farbton 206°), sonst faellt es auf dem dunklen
       Grund unter 3:1 und der groesste Balkenanteil wirkt wie eine Luecke.
       Als kleine Schrift braucht es nochmal eine Stufe heller. */
    --push: #ffb900;
    --pull: #007ad6;
    --pull-ink: #4aa8f0;
    --r-lg: 24px;
    --r-md: 18px;
    --r-sm: 14px;
  }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  /* dezenter Lichtschein oben – nimmt dem Schwarz die Flachheit */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: 380px; z-index: -1;
    background: radial-gradient(90% 100% at 50% 0%, rgba(204, 255, 77, .07), transparent 70%);
    pointer-events: none;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; padding: 0; }
  input { -webkit-user-select: text; user-select: text; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------------- Kopf ---------------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(rgba(8, 9, 13, .95), rgba(8, 9, 13, .72));
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding: calc(12px + env(safe-area-inset-top))
             calc(20px + env(safe-area-inset-right)) 12px
             calc(20px + env(safe-area-inset-left));
    display: flex; align-items: center; gap: 12px;
  }
  header h1 {
    font-size: 21px; margin: 0; font-weight: 700; letter-spacing: -.03em;
  }
  header .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px rgba(204, 255, 77, .55);
  }
  header .sub {
    margin-left: auto; color: var(--muted); font-size: 13.5px; font-weight: 500;
  }

  main {
    padding: 8px calc(20px + env(safe-area-inset-right)) 16px calc(20px + env(safe-area-inset-left));
    max-width: 620px; margin: 0 auto;
  }
  .view { display: none; }
  /* Nur opacity animieren: ein transform hier wuerde einen Containing Block
     erzeugen und den fixierten Speichern-Button darin einsperren. */
  .view.active { display: block; animation: fade .22s ease both; }
  @keyframes fade { from { opacity: 0; } }

  /* ---------------- Karten ---------------- */
  .card {
    background: var(--card);
    border-radius: var(--r-lg);
    padding: 6px 18px 18px;
    margin-bottom: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045);
  }
  .card.flush { padding: 4px 18px; }

  .section-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 16px 2px 12px;
  }
  .section-head h2 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.02em; }
  .section-head .meta { margin-left: auto; color: var(--dim); font-size: 13px; font-weight: 500; }

  /* ---------------- Übungsauswahl ---------------- */
  .picker { padding: 14px 0 4px; }
  .picker .cap {
    font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 2px;
  }
  .picker select {
    -webkit-appearance: none; appearance: none;
    width: 100%; background: transparent; border: 0; padding: 2px 32px 2px 0;
    font-size: 22px; font-weight: 700; letter-spacing: -.03em; line-height: 1.3;
    outline: none;
    /* lange Maschinennamen sauber kuerzen statt hart abschneiden */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 11px) 60%, calc(100% - 5px) 60%;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }
  .picker select:focus { color: var(--accent); }

  .hint {
    display: inline-flex; align-items: center; gap: 7px;
    margin: 12px 0 4px; padding: 7px 13px 7px 11px;
    background: var(--card-2); border-radius: 999px;
    font-size: 13.5px; color: var(--muted); font-weight: 500;
  }
  .hint b { color: var(--accent); font-weight: 650; }
  .hint::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--dim); flex: none;
  }

  /* ---------------- Zahlen-Eingabe ---------------- */
  .field { margin-top: 18px; }
  .field > .cap {
    font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 8px; padding-left: 2px;
  }
  .dial { display: flex; align-items: center; gap: 12px; }
  .dial .round {
    flex: none; width: 58px; height: 58px; border-radius: 50%;
    background: var(--raise); color: var(--text);
    font-size: 27px; font-weight: 400; line-height: 1;
    display: grid; place-items: center;
    transition: background .15s, transform .12s;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
  }
  .dial .round:active { background: var(--accent); color: var(--ink); transform: scale(.93); }
  .dial .val {
    flex: 1; min-width: 0; display: flex; align-items: baseline;
    justify-content: center; gap: 5px;
  }
  /* feste Zeichenbreite statt 100%: so bleibt die Zahl mittig zwischen den
     Tasten und springt beim Tippen nicht hin und her */
  .dial .val input {
    width: 4.5ch; min-width: 0; background: transparent; border: 0; outline: none;
    text-align: right; font-size: 38px; font-weight: 750; letter-spacing: -.045em;
    font-variant-numeric: tabular-nums; padding: 0;
    -moz-appearance: textfield;
  }
  .dial .val input::-webkit-outer-spin-button,
  .dial .val input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .dial .val .unit {
    flex: none; font-size: 15px; font-weight: 600; color: var(--dim);
    width: 42px; text-align: left;
  }

  /* ---------------- Buttons ---------------- */
  .btn {
    display: block; width: 100%; border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--ink); font-weight: 700; font-size: 18px; letter-spacing: -.02em;
    padding: 18px; box-shadow: 0 10px 30px -12px rgba(204, 255, 77, .7);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: scale(.982); box-shadow: 0 6px 18px -12px rgba(204, 255, 77, .7); }
  .btn.ghost {
    background: var(--card); color: var(--text); font-size: 16px; font-weight: 600;
    padding: 16px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045); border-radius: var(--r-sm);
  }
  .btn.ghost:active { background: var(--card-2); transform: none; }
  .btn.danger { color: var(--danger); }

  /* Speichern liegt fest ueber der Tab-Leiste – oben in der Karte waere er
     auf einem 6,7"-Display ausserhalb der Daumenzone, sobald die Liste waechst.
     Als Kind von #view-log verschwindet er automatisch in den anderen Tabs. */
  .savebar {
    position: fixed; z-index: 15;
    left: 0; right: 0; max-width: 620px; margin: 0 auto;
    bottom: calc(88px + env(safe-area-inset-bottom));
    padding: 0 calc(20px + env(safe-area-inset-right)) 0 calc(20px + env(safe-area-inset-left));
  }
  .savebar::before {
    content: ""; position: absolute; left: 0; right: 0; top: -30px; bottom: -30px;
    background: linear-gradient(rgba(8, 9, 13, 0), rgba(8, 9, 13, .92) 34%, rgba(8, 9, 13, .92));
    pointer-events: none; z-index: -1;
  }
  #view-log { padding-bottom: 92px; }

  /* ---------------- Satzliste ---------------- */
  .exgroup + .exgroup { margin-top: 22px; }
  .exgroup h3 {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 17px; font-weight: 650; margin: 0 0 4px; letter-spacing: -.02em;
  }
  .exgroup h3 .pill {
    margin-left: auto; font-size: 12px; font-weight: 600; color: var(--dim);
  }
  .setrow {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-top: 1px solid var(--hair);
  }
  .setrow .idx {
    flex: none; width: 22px; font-size: 13px; font-weight: 650; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .setrow .load {
    font-size: 18px; font-weight: 650; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .setrow .load .u { font-size: 13px; font-weight: 500; color: var(--dim); margin-left: 2px; }
  .setrow .times { color: var(--dim); font-size: 14px; }
  /* Das Loeschkreuz liegt als 48px breiter Streifen genau dort, wo beim
     Scrollen der Daumen entlanggeht. Es existiert deshalb nur in einer
     freigegebenen Liste – sonst gar nicht, nicht bloss unsichtbar. */
  .setrow .x { display: none; }
  /* volle 44pt Trefferflaeche, ohne die Zeile aufzublaehen */
  .unlocked .setrow .x {
    margin: -13px -6px -13px auto; width: 48px; align-self: stretch;
    display: grid; place-items: center; color: var(--dim);
    transition: color .15s;
  }
  .setrow .x svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
  .setrow .x:active { color: var(--danger); }

  /* ---------------- Verlauf ---------------- */
  .day {
    background: var(--card); border-radius: var(--r-lg); margin-bottom: 12px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045); overflow: hidden;
  }
  /* Block statt Flex-Zeile: vorher rutschten die Kennzahlen je nach Textlaenge
     mal neben das Datum, mal darunter – dadurch waren die Karten unterschiedlich
     hoch und nichts fluchtete. Jede Zeile hat jetzt eine feste Aufgabe. */
  .day > summary {
    padding: 15px 18px 16px; cursor: pointer; list-style: none; display: block;
  }
  .day > summary::-webkit-details-marker { display: none; }
  .day > summary .daytags { margin: 0 0 9px; }
  .day .dline { display: flex; align-items: center; gap: 10px; }
  .day .date { font-weight: 650; font-size: 16px; letter-spacing: -.02em; }
  /* Einzeilig mit Auslassung: lange Maschinennamen wuerden sonst umbrechen und
     die Karten waeren wieder unterschiedlich hoch – genau das sollte weg. */
  .day .exs {
    margin-top: 5px; font-size: 13.5px; line-height: 1.35;
    color: var(--muted); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .day .nums {
    margin-top: 4px; font-size: 12.5px; color: var(--dim); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .day .chev {
    margin-left: auto;
    flex: none; width: 16px; height: 16px; stroke: var(--dim); stroke-width: 2.2;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .22s ease;
  }
  .day[open] .chev { transform: rotate(90deg); }
  .day .body { padding: 2px 18px 18px; }

  /* Nachtragen. Das Datumsfeld liegt unsichtbar ueber dem Knopf – so oeffnet
     ein Tipp direkt die native Datumsauswahl, ohne eigene Kalender-Oberflaeche. */
  .addday { position: relative; margin-bottom: 12px; }
  .addday button, .addset button {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 46px; border-radius: var(--r-md);
    background: var(--card); color: var(--muted);
    font-size: 14px; font-weight: 600; letter-spacing: -.01em;
    box-shadow: inset 0 0 0 1px var(--hair);
  }
  .addday button svg, .addset button svg {
    width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2;
    fill: none; stroke-linecap: round;
  }
  .addday input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; -webkit-appearance: none; appearance: none; background: none;
  }
  .addset { margin-top: 14px; }
  .addset button { background: var(--card-2); box-shadow: none; }

  /* Freigabe je Trainingstag */
  .day .lockbar { display: flex; justify-content: flex-end; }
  .day .lock {
    margin-right: -6px; padding: 0 14px; min-height: 44px; border-radius: 999px;
    display: flex; align-items: center;
    font-size: 13px; font-weight: 600; color: var(--muted);
    transition: color .15s, background .15s;
  }
  .day .lock span { display: inline-flex; align-items: center; gap: 7px; }
  .day .lock svg {
    width: 15px; height: 15px; stroke: currentColor; stroke-width: 2;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .day.unlocked .lock { color: var(--ink); background: var(--accent); }
  /* Beschriftung und Symbol wechseln rein ueber die Klasse am Tag – so kostet
     das Auf- und Zusperren kein Neuzeichnen der ganzen Liste. */
  .day .lock .b, .day.unlocked .lock .a { display: none; }
  .day.unlocked .lock .b { display: inline-flex; }
  .day.unlocked { box-shadow: inset 0 0 0 1px var(--accent-soft); }

  /* ---------------- Statistik ---------------- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .tile {
    background: var(--card); border-radius: var(--r-md); padding: 16px 10px 14px;
    text-align: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045);
  }
  .tile .v {
    font-size: 25px; font-weight: 750; letter-spacing: -.04em; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .tile .k { font-size: 12.5px; color: var(--dim); font-weight: 500; margin-top: 3px; }

  .statrow {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 0; border-top: 1px solid var(--hair);
  }
  .statrow:first-child { border-top: 0; }
  .statrow .nm { min-width: 0; font-weight: 600; letter-spacing: -.02em; }
  .statrow .nm small {
    display: block; color: var(--dim); font-weight: 500; font-size: 12.5px; margin-top: 1px;
  }
  .statrow .pr { margin-left: auto; text-align: right; flex: none; }
  .statrow .pr b {
    display: block; color: var(--accent); font-size: 18px; font-weight: 700;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  }
  .statrow .pr small { color: var(--dim); font-size: 12px; font-weight: 500; }

  /* ---------------- Trainingseinheit ---------------- */
  .startcard {
    background: var(--card); border-radius: var(--r-lg); padding: 30px 22px 24px;
    margin-bottom: 16px; text-align: center;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045);
  }
  .startcard h2 {
    font-size: 21px; font-weight: 700; letter-spacing: -.03em; margin: 0 0 6px;
  }
  .startcard p { margin: 0 0 22px; color: var(--muted); font-size: 14.5px; }
  .startcard .btn { max-width: 320px; margin: 0 auto; }

  /* zwei oder drei Kacheln – die Dauer fehlt bei nachgetragenen Trainings */
  .summary {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px;
    margin: 0 0 22px;
  }
  .summary div { background: var(--card-2); border-radius: var(--r-sm); padding: 12px 6px; }
  .summary .v {
    font-size: 19px; font-weight: 750; letter-spacing: -.035em;
    font-variant-numeric: tabular-nums;
  }
  .summary .k { font-size: 11.5px; color: var(--dim); font-weight: 500; margin-top: 2px; }
  .startcard .done {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 14px;
    padding: 6px 14px 6px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13px; font-weight: 650;
  }
  .startcard .done svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .sessionbar {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: var(--r-md);
    padding: 12px 12px 12px 16px; margin-bottom: 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045);
  }
  .sessionbar .live {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .28; } }
  /* Nachtrag: gleiche Leiste, aber ohne pulsierenden Punkt – hier laeuft nichts */
  .sessionbar.backfill > svg {
    flex: none; width: 20px; height: 20px; stroke: var(--accent);
    stroke-width: 2.2; fill: none; stroke-linecap: round;
  }
  .sessionbar.backfill .time { font-size: 15.5px; font-weight: 650; letter-spacing: -.015em; }
  .sessionbar .txt { min-width: 0; line-height: 1.25; }
  .sessionbar .txt b { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .sessionbar .time {
    font-size: 19px; font-weight: 700; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }
  .sessionbar .stop {
    margin-left: auto; flex: none; padding: 11px 17px; border-radius: 12px;
    background: var(--card-2); color: var(--text); font-size: 14.5px; font-weight: 650;
    transition: background .15s;
  }
  .sessionbar .stop:active { background: var(--raise); }

  /* ---------------- Übersicht ---------------- */
  /* Ohne Karte: das Raster sitzt direkt auf der Seite, die seitlichen
     Abstaende kommen von main. */
  .heat-wrap { margin: 2px 0 20px; }
  .heat-grid {
    display: grid; grid-template-rows: repeat(7, 1fr);
    grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px;
  }
  .heat-grid i {
    aspect-ratio: 1; border-radius: 3px; background: rgba(255, 255, 255, .045);
  }
  /* Anker im sonst gleichfoermigen Raster. Aussen liegend, damit die
     Fuellfarbe der Kachel nicht angeknabbert wird – Linie plus Abstand
     bleiben knapp unter der 3 px Luecke. */
  .heat-grid i.t {
    outline: 1.5px solid rgba(255, 255, 255, .32); outline-offset: 1px;
  }
  .heat-grid i.f { background: rgba(255, 255, 255, .015); }
  .heat-grid i.l1 { background: rgba(204, 255, 77, .26); }
  .heat-grid i.l2 { background: rgba(204, 255, 77, .48); }
  .heat-grid i.l3 { background: rgba(204, 255, 77, .72); }
  .heat-grid i.l4 { background: var(--accent); }
  .heat-legend {
    display: flex; align-items: center; gap: 5px; margin-top: 12px;
    font-size: 11.5px; color: var(--dim); font-weight: 500;
  }
  .heat-legend i { width: 11px; height: 11px; border-radius: 3px; }
  .heat-legend .sp { margin-left: auto; }

  /* ---------------- Pausentimer ---------------- */
  .sessionbar.resting { background: var(--card-2); padding: 10px 12px; gap: 10px; }
  .resting .adj {
    flex: none; width: 48px; height: 48px; border-radius: 14px; background: var(--raise);
    color: var(--text); font-size: 12.5px; font-weight: 700; display: grid; place-items: center;
    font-variant-numeric: tabular-nums; transition: background .15s;
  }
  .resting .adj:active { background: var(--hair-strong); }
  .resting .cd { min-width: 0; flex: 1; text-align: center; line-height: 1.15; }
  .resting .cd b {
    display: block; font-size: 25px; font-weight: 750; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }
  .resting .cd small { font-size: 11.5px; color: var(--dim); font-weight: 600; }
  .sessionbar.over .cd b { color: var(--accent); }
  .sessionbar.over { animation: flash 1.1s ease-in-out 3; }
  @keyframes flash { 50% { background: var(--accent-soft); } }

  /* ---------------- Sicherungs-Hinweis ---------------- */
  .backup {
    display: flex; align-items: center; gap: 13px;
    background: var(--card-2); border-radius: var(--r-md);
    padding: 14px 14px 14px 16px; margin-bottom: 16px; text-align: left;
  }
  .backup svg {
    width: 21px; height: 21px; flex: none; stroke: var(--accent);
    stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .backup .t { min-width: 0; font-size: 13.5px; color: var(--muted); line-height: 1.35; }
  .backup .t b { display: block; color: var(--text); font-size: 14.5px; font-weight: 650; }
  .backup button {
    margin-left: auto; flex: none; padding: 11px 15px; border-radius: 12px;
    background: var(--accent); color: var(--ink); font-size: 14px; font-weight: 700;
  }

  /* ---------------- Übung verwalten ---------------- */
  .picker { display: flex; align-items: flex-end; gap: 8px; }
  .picker .sel { flex: 1; min-width: 0; }
  .picker .manage {
    flex: none; width: 44px; height: 44px; border-radius: 13px; background: var(--card-2);
    display: grid; place-items: center; margin-bottom: 2px; transition: background .15s;
  }
  .picker .manage:active { background: var(--raise); }
  .picker .manage svg {
    width: 19px; height: 19px; stroke: var(--muted); stroke-width: 2.2;
    fill: none; stroke-linecap: round;
  }

  /* ---------------- Satz in Bearbeitung ---------------- */
  .setrow.editing {
    background: var(--accent-soft); border-radius: 10px;
    margin: 0 -10px; padding-left: 13px; padding-right: 0; border-top-color: transparent;
  }
  .setrow.editing .idx { color: var(--accent); }
  .editbar {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
    font-size: 13.5px; color: var(--muted); font-weight: 500;
  }
  .editbar button {
    margin-left: auto; color: var(--muted); font-weight: 650; font-size: 14px;
    padding: 6px 2px;
  }

  /* ---------------- Muskelgruppen ---------------- */
  .dist { margin-bottom: 16px; }
  .dist .row {
    display: flex; align-items: center; gap: 11px; padding: 6px 0;
  }
  .dist .nm { width: 84px; flex: none; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .dist .track {
    flex: 1; min-width: 0; height: 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .05); overflow: hidden;
  }
  /* Die Balkenlaenge ist der Anteil der Gruppe, die Segmente darin ihre
     Aufteilung nach Bewegung. Muskelgruppen sind nicht sortenrein: Beine
     enthalten Leg Press und Leg Curl, Schultern Pressen und Reverse Fly. */
  .dist .fill { height: 100%; border-radius: 999px; display: flex; overflow: hidden; }
  .dist .fill i { height: 100%; }
  .dist .pct {
    width: 44px; flex: none; text-align: right; font-size: 13px; font-weight: 650;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .dist .row.zero .nm, .dist .row.zero .pct { color: var(--dim); font-weight: 500; }
  .dist .hint {
    display: block; margin-top: 10px; padding: 0;
    background: none; border-radius: 0; font-size: 12.5px; color: var(--dim);
  }

  /* Bewegungsfarben – gelten fuer Balkensegment und Legendenpunkt gleichermassen */
  .push { background: var(--push); }
  .pull { background: var(--pull); }
  .neut { background: var(--dim); }
  .open { background: rgba(255, 255, 255, .13); }

  /* Farbschluessel im Kartenkopf: erklaert die Segmente, ohne eine eigene
     Zeile zu kosten – der Kopf ist ohnehin da. */
  .section-head .key { display: flex; gap: 13px; margin-left: auto; }
  .section-head .key span { display: inline-flex; align-items: center; gap: 5px; }
  .section-head .key i { width: 9px; height: 9px; border-radius: 3px; flex: none; }

  /* abgeleitete Gruppen am Trainingstag */
  .daytags {
    display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px;
  }
  .daytags span {
    font-size: 11px; font-weight: 650; color: var(--muted);
    background: var(--card-2); border-radius: 999px; padding: 3px 9px;
  }
  .daytags .mv.push { background: rgba(255, 185, 0, .15); color: var(--push); }
  .daytags .mv.pull { background: rgba(0, 122, 214, .22); color: var(--pull-ink); }
  .daytags .mv.mixed { background: var(--raise); color: var(--muted); }

  /* Hinweis auf unzugeordnete Maschinen */
  .untagged {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--card-2); border-radius: var(--r-md);
    padding: 14px 14px 14px 16px; margin-bottom: 14px; text-align: left;
  }
  .untagged svg {
    width: 20px; height: 20px; flex: none; stroke: var(--accent);
    stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .untagged .t { min-width: 0; font-size: 13.5px; color: var(--muted); line-height: 1.35; }
  .untagged .t b { display: block; color: var(--text); font-size: 14.5px; font-weight: 650; }
  .untagged .go { margin-left: auto; flex: none; color: var(--accent); font-weight: 700; font-size: 14px; }

  /* ---------------- Auswahl-Blatt ---------------- */
  .sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; }
  .sheet[hidden] { display: none; }
  .sheet .bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
  .sheet .card {
    position: relative; width: 100%; max-width: 620px; margin: 0 auto;
    background: var(--card); border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
    animation: rise .22s cubic-bezier(.2, .9, .3, 1.05) both;
    max-height: 86vh; overflow-y: auto;
  }
  @keyframes rise { from { transform: translateY(100%); } }
  .sheet h3 {
    margin: 0 0 4px; font-size: 19px; font-weight: 700; letter-spacing: -.03em;
  }
  .sheet p { margin: 0 0 16px; font-size: 13.5px; color: var(--muted); }
  .sheet .lbl {
    font-size: 12.5px; color: var(--muted); font-weight: 600;
    margin: 4px 0 8px; letter-spacing: -.01em;
  }
  .sheet .lbl + .opts { margin-bottom: 18px; }
  .sheet .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .sheet .opts.three { grid-template-columns: repeat(3, 1fr); }
  .sheet .opts.three button { padding: 15px 4px; font-size: 14.5px; }
  .sheet .btn { margin-top: 2px; }
  .sheet .opts button {
    padding: 16px 10px; border-radius: var(--r-sm); background: var(--card-2);
    font-size: 15.5px; font-weight: 600; letter-spacing: -.01em;
    transition: background .15s;
  }
  .sheet .opts button:active { background: var(--raise); }
  .sheet .opts button.on { background: var(--accent); color: var(--ink); font-weight: 700; }
  .sheet .cancel {
    width: 100%; margin-top: 12px; padding: 15px; border-radius: var(--r-sm);
    color: var(--muted); font-size: 15px; font-weight: 600;
  }

  /* ---------------- Leerzustände ---------------- */
  .empty { text-align: center; padding: 54px 24px; color: var(--dim); }
  .empty svg {
    width: 46px; height: 46px; stroke: var(--dim); stroke-width: 1.4; fill: none;
    stroke-linecap: round; stroke-linejoin: round; opacity: .55; margin-bottom: 14px;
  }
  .empty p { margin: 0; font-size: 15px; line-height: 1.5; }
  .empty p b { display: block; color: var(--muted); font-weight: 600; margin-bottom: 3px; }

  /* ---------------- Tab-Leiste ---------------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: center; gap: 4px;
    background: linear-gradient(rgba(8, 9, 13, .72), rgba(8, 9, 13, .96));
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--hair);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1; max-width: 130px; min-height: 54px; border-radius: var(--r-sm);
    color: var(--dim); font-size: 11.5px; font-weight: 600; letter-spacing: -.01em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: color .18s, background .18s;
  }
  nav button svg {
    width: 23px; height: 23px; stroke: currentColor; fill: none;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
  }
  nav button.active { color: var(--accent); background: var(--accent-soft); }

  /* ---------------- Toast ---------------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(166px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px) scale(.96); z-index: 50;
    background: var(--raise); color: var(--text);
    font-weight: 600; font-size: 14.5px; letter-spacing: -.01em;
    padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 16px 40px -14px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .07);
    opacity: 0; pointer-events: none; white-space: nowrap; max-width: 90vw;
    transition: opacity .22s, transform .22s cubic-bezier(.2, .9, .3, 1.2);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  /* nur mit Aktion anklickbar, sonst schluckt der Hinweis Taps darunter */
  .toast.act { pointer-events: auto; }
  .toast .undo {
    margin: -12px -6px -12px 16px; padding: 12px 6px;
    color: var(--accent); font-weight: 700; letter-spacing: -.01em;
  }
  .toast.good { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--ink); }
  .toast.warn { background: var(--danger); color: #fff; }

  /* auf sehr schmalen Geraeten (SE) wuerde die Zahl zu stark gequetscht */
  @media (max-width: 340px) {
    .dial .round { width: 50px; height: 50px; }
    .dial .val input { font-size: 32px; }
  }
</style>
</head>
<body>

<header>
  <span class="dot"></span>
  <h1>Gym Tracker</h1>
  <span class="sub" id="headerSub"></span>
</header>

<main>
  <!-- ============ TRAINING ============ -->
  <section id="view-log" class="view">
    <div id="sessionArea"></div>

    <div class="card" id="inputCard">
      <div class="picker">
        <div class="sel">
          <div class="cap">Maschine / Übung</div>
          <select id="exercise" aria-label="Maschine oder Übung"></select>
        </div>
        <button class="manage" id="manageExercise" type="button" aria-label="Übung umbenennen oder löschen">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></svg>
        </button>
      </div>
      <div class="hint" id="lastHint"></div>

      <div class="field">
        <div class="cap">Gewicht</div>
        <div class="dial">
          <button class="round" type="button" data-step="weight" data-delta="-2.5" aria-label="2,5 kg weniger">−</button>
          <div class="val">
            <input id="weight" type="number" inputmode="decimal" step="0.5" min="0" value="20" aria-label="Gewicht in Kilogramm">
            <span class="unit">kg</span>
          </div>
          <button class="round" type="button" data-step="weight" data-delta="2.5" aria-label="2,5 kg mehr">+</button>
        </div>
      </div>

      <div class="field">
        <div class="cap">Wiederholungen</div>
        <div class="dial">
          <button class="round" type="button" data-step="reps" data-delta="-1" aria-label="Eine Wiederholung weniger">−</button>
          <div class="val">
            <input id="reps" type="number" inputmode="numeric" step="1" min="1" value="10" aria-label="Wiederholungen">
            <span class="unit">Wdh.</span>
          </div>
          <button class="round" type="button" data-step="reps" data-delta="1" aria-label="Eine Wiederholung mehr">+</button>
        </div>
      </div>

      <div id="editBar"></div>
    </div>

    <div class="savebar">
      <button class="btn" id="saveSet">Satz speichern</button>
    </div>

    <div id="todayList"></div>
  </section>

  <!-- ============ ÜBERSICHT ============ -->
  <section id="view-overview" class="view active">
    <div id="overview"></div>
  </section>

  <!-- ============ VERLAUF ============ -->
  <section id="view-history" class="view">
    <div id="historyList"></div>
  </section>

  <!-- ============ STATISTIK ============ -->
  <section id="view-stats" class="view">
    <div id="statsCard"></div>
    <button class="btn ghost" id="exportBtn" style="margin-bottom:10px">Daten exportieren</button>
    <button class="btn ghost" id="importBtn" style="margin-bottom:10px">Backup importieren</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button class="btn ghost danger" id="wipeBtn">Alle Daten löschen</button>
  </section>
</main>

<nav>
  <button data-view="overview" class="active">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
    Übersicht
  </button>
  <button data-view="log">
    <svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 6.5v11M17 6.5v11M7 12h10"/></svg>
    Training
  </button>
  <button data-view="history">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg>
    Verlauf
  </button>
  <button data-view="stats">
    <svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-4"/></svg>
    Statistik
  </button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="bg" data-sheet-close></div>
  <div class="card">
    <h3 id="sheetTitle">Muskelgruppe</h3>
    <p id="sheetSub"></p>
    <div id="sheetBody"></div>
    <button class="cancel" type="button" data-sheet-close>Abbrechen</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var KEY = "gymTracker.v1";

  // Die App startet ohne Uebungen – du legst die Maschinen deines Studios selbst an.
  var DEFAULT_EXERCISES = [];

  // Frueher mitgelieferte Liste. Eintraege daraus, zu denen keine Saetze
  // existieren, werden einmalig entfernt; benutzte bleiben unangetastet.
  var LEGACY_DEFAULTS = [
    "Beinpresse", "Beinstrecker", "Beinbeuger", "Wadenheben",
    "Brustpresse", "Butterfly", "Schulterpresse", "Seitheben",
    "Latzug", "Rudermaschine", "Rückenstrecker", "Bauchmaschine",
    "Bizepsmaschine", "Trizepsdrücken", "Kniebeuge", "Bankdrücken",
    "Kreuzheben", "Klimmzüge"
  ];

  var BACKUP_FAELLIG = 4;   // Erinnerung nach so vielen beendeten Trainings

  // Feste Auswahl statt freier Eingabe: nur so bleibt die Auswertung aggregierbar.
  // Genau eine Hauptgruppe je Maschine, damit sich das Volumen exakt aufteilt.
  var GROUPS = [
    { k: "brust", n: "Brust" },
    { k: "ruecken", n: "Rücken" },
    { k: "beine", n: "Beine" },
    { k: "schultern", n: "Schultern" },
    { k: "arme", n: "Arme" },
    { k: "rumpf", n: "Rumpf" }
  ];
  function groupName(k) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].k === k) return GROUPS[i].n;
    return "Nicht zugeordnet";
  }

  // Zweite, unabhaengige Achse. Bewusst nicht aus der Muskelgruppe abgeleitet:
  // Shoulder Press und Reverse Fly sind beide "Schultern", aber Druecken bzw.
  // Ziehen. "Beine" fehlt hier absichtlich – das ist eine Muskelgruppe, keine
  // Bewegung, sonst faellt Beintraining aus der Bilanz.
  var MOVES = [
    { k: "push", n: "Push" },
    { k: "pull", n: "Pull" },
    { k: "neutral", n: "Neutral" }
  ];
  function moveName(k) {
    for (var i = 0; i < MOVES.length; i++) if (MOVES[i].k === k) return MOVES[i].n;
    return "Ohne Angabe";
  }

  var ICON_X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
  var ICON_PEN = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></svg>';
  var ICON_OK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_PLUS = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';

  // ---------- Daten ----------
  var db = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.sets)) {
          d.exercises = Array.isArray(d.exercises) ? d.exercises : [];
          d.settings = normSettings(d.settings);
          d.workouts = (d.workouts && typeof d.workouts === "object") ? d.workouts : {};
          d.session = (d.session && d.session.start) ? d.session : null;
          d.backup = (d.backup && typeof d.backup === "object") ? d.backup : { at: 0, due: 0 };
          d.groups = (d.groups && typeof d.groups === "object") ? d.groups : {};
          d.moves = (d.moves && typeof d.moves === "object") ? d.moves : {};
          return migrate(d);
        }
      }
    } catch (e) { /* korrupte Daten: frisch starten */ }
    return leer();
  }

  function leer() {
    return {
      sets: [], exercises: DEFAULT_EXERCISES.slice(), settings: normSettings(null),
      workouts: {}, session: null, backup: { at: 0, due: 0 }, groups: {}, moves: {}, v: 2
    };
  }

  // Pausenlaenge: 15–600 Sek, Standard 90. Wird beim Nachjustieren fortgeschrieben.
  function normSettings(s) {
    var r = s && parseInt(s.restSec, 10);
    return { restSec: (r >= 15 && r <= 600) ? r : 90 };
  }

  // Einmalige Umstellung: mitgelieferte Uebungen ohne Saetze verschwinden.
  function migrate(d) {
    if (d.v >= 2) return d;
    var benutzt = {};
    d.sets.forEach(function (s) { benutzt[s.exercise] = 1; });
    d.exercises = d.exercises.filter(function (n) {
      return benutzt[n] || LEGACY_DEFAULTS.indexOf(n) === -1;
    });
    d.v = 2;
    return d;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
    } catch (e) {
      toast("Speichern fehlgeschlagen – Speicher voll?", "warn");
    }
  }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function fmtWeight(w) {
    return (Math.round(w * 10) / 10).toString().replace(".", ",");
  }

  function fmtDate(key) {
    var p = key.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var days = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
    var yd = new Date(); yd.setDate(yd.getDate() - 1);
    var ydKey = yd.getFullYear() + "-" + pad(yd.getMonth() + 1) + "-" + pad(yd.getDate());
    var label = days[d.getDay()] + ", " + p[2] + "." + p[1] + "." + p[0];
    if (key === todayKey()) return "Heute · " + label;
    if (key === ydKey) return "Gestern · " + label;
    return label;
  }

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var exSel = $("exercise"), weightIn = $("weight"), repsIn = $("reps");

  // ---------- Muskelgruppe wählen ----------
  var sheetCb = null;

  var classifyName = null, classifyDone = null;

  // Aktionsmenue: schliesst sofort bei der Auswahl
  function openSheet(title, sub, opts, cb) {
    sheetCb = cb;
    classifyName = null;
    $("sheetTitle").textContent = title;
    $("sheetSub").textContent = sub;
    $("sheetBody").innerHTML = '<div class="opts">' + opts.map(function (o) {
      return '<button type="button" data-opt="' + o.k + '"' +
        (o.on ? ' class="on"' : "") + '>' + esc(o.n) + '</button>';
    }).join("") + '</div>';
    $("sheet").hidden = false;
  }

  // Einordnen: beide Achsen in einem Blatt, Bestaetigen per Knopf.
  // Teilweise Angabe ist erlaubt – sonst waere das Blatt eine Sackgasse.
  function openClassify(name, done) {
    sheetCb = null;
    classifyName = name;
    classifyDone = done || null;
    var g = db.groups[name] || "", m = db.moves[name] || "";
    function feld(set, liste, aktiv) {
      return '<div class="opts' + (liste.length === 3 ? " three" : "") + '" data-set="' + set + '">' +
        liste.map(function (o) {
          return '<button type="button" data-pick="' + o.k + '"' +
            (o.k === aktiv ? ' class="on"' : "") + '>' + esc(o.n) + '</button>';
        }).join("") + '</div>';
    }
    $("sheetTitle").textContent = name;
    $("sheetSub").textContent = "Bestimmt, wie diese Maschine in die Auswertung eingeht.";
    $("sheetBody").innerHTML =
      '<div class="lbl">Muskelgruppe</div>' + feld("grp", GROUPS, g) +
      '<div class="lbl">Bewegung</div>' + feld("mov", MOVES, m) +
      '<button class="btn" type="button" id="sheetOk">Übernehmen</button>';
    $("sheet").hidden = false;
  }

  function applyClassify() {
    var g = $("sheetBody").querySelector('[data-set="grp"] .on');
    var m = $("sheetBody").querySelector('[data-set="mov"] .on');
    if (g) db.groups[classifyName] = g.dataset.pick;
    if (m) db.moves[classifyName] = m.dataset.pick;
    var done = classifyDone;
    classifyName = null; classifyDone = null;
    $("sheet").hidden = true;
    save(); renderAll();
    if (done) done();
  }

  function closeSheet() {
    $("sheet").hidden = true;
    classifyName = null; classifyDone = null;
    var cb = sheetCb;
    sheetCb = null;
    return cb;
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest("[data-sheet-close]")) { closeSheet(); return; }
    if (e.target.closest("#sheetOk")) { applyClassify(); return; }

    // Auswahl im Formular: markieren, aber nicht schliessen
    var pick = e.target.closest("[data-pick]");
    if (pick) {
      var box = pick.parentElement;
      [].forEach.call(box.querySelectorAll("[data-pick]"), function (b) {
        b.classList.remove("on");
      });
      pick.classList.add("on");
      return;
    }

    var g = e.target.closest("[data-opt]");
    if (!g) return;
    var cb = closeSheet();
    if (cb) cb(g.dataset.opt);
  });

  // Volumen je Muskelgruppe; unzugeordnetes bleibt sichtbar, damit sich die
  // Anteile nicht heimlich auf 100 % schoenrechnen.
  function volumeByGroup(sets) {
    var m = {};
    sets.forEach(function (s) {
      var k = db.groups[s.exercise] || "";
      m[k] = (m[k] || 0) + s.weight * s.reps;
    });
    return m;
  }

  // Unvollstaendig ist, wem mindestens eine der beiden Angaben fehlt
  function ohneGruppe() {
    return allExercises().filter(function (n) { return !db.groups[n] || !db.moves[n]; });
  }

  // Der Reihe nach durchgehen, damit der Altbestand in einem Rutsch wegkommt
  function zuordnenReihe() {
    var offen = ohneGruppe();
    if (!offen.length) { toast("Alles eingeordnet", "good"); return; }
    openClassify(offen[0], function () {
      if (ohneGruppe().length) zuordnenReihe();
      else toast("Alles eingeordnet", "good");
    });
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("#assignNext")) zuordnenReihe();
  });

  // ---------- Übungsliste ----------
  function allExercises() {
    var seen = {}, out = [];
    db.exercises.concat(db.sets.map(function (s) { return s.exercise; }))
      .forEach(function (n) {
        if (n && !seen[n.toLowerCase()]) { seen[n.toLowerCase()] = 1; out.push(n); }
      });
    return out.sort(function (a, b) { return a.localeCompare(b, "de"); });
  }

  function renderExercises(selected) {
    var cur = selected || exSel.value;
    exSel.innerHTML = "";
    allExercises().forEach(function (n) {
      var o = document.createElement("option");
      o.value = n; o.textContent = n;
      exSel.appendChild(o);
    });
    var o = document.createElement("option");
    o.value = "__new__"; o.textContent = "＋ Neue Übung anlegen …";
    exSel.appendChild(o);
    if (cur && cur !== "__new__") exSel.value = cur;
    if (!exSel.value) exSel.selectedIndex = 0;
    updateHint();
  }

  exSel.addEventListener("change", function () {
    if (exSel.value === "__new__") {
      var name = (prompt("Name der Maschine / Übung:") || "").trim();
      if (name) {
        var exists = allExercises().filter(function (n) { return n.toLowerCase() === name.toLowerCase(); })[0];
        if (exists) { renderExercises(exists); }
        else {
          db.exercises.push(name);
          save();
          renderExercises(name);
          // direkt einordnen, damit kein unzugeordneter Bestand entsteht
          openClassify(name, function () { renderExercises(name); });
        }
      } else {
        renderExercises(lastUsedExercise());
      }
    } else {
      updateHint();
      prefillFromLast();
    }
  });

  function lastUsedExercise() {
    return db.sets.length ? db.sets[db.sets.length - 1].exercise : null;
  }

  function lastSetFor(ex) {
    for (var i = db.sets.length - 1; i >= 0; i--) {
      if (db.sets[i].exercise === ex) return db.sets[i];
    }
    return null;
  }

  function bestFor(ex) {
    var best = null;
    db.sets.forEach(function (s) {
      if (s.exercise !== ex) return;
      if (!best || s.weight > best.weight || (s.weight === best.weight && s.reps > best.reps)) best = s;
    });
    return best;
  }

  function updateHint() {
    var ex = exSel.value;
    if (!ex || ex === "__new__") {
      $("lastHint").textContent = "Lege deine erste Maschine an";
      return;
    }
    var last = lastSetFor(ex);
    if (!last) { $("lastHint").textContent = "Noch keine Sätze für diese Übung"; return; }
    var best = bestFor(ex);
    var txt = "Zuletzt " + fmtWeight(last.weight) + " kg × " + last.reps;
    if (last.date !== todayKey()) txt += " am " + last.date.split("-").reverse().slice(0, 2).join(".");
    var html = esc(txt);
    if (best && (best.weight !== last.weight || best.reps !== last.reps)) {
      html += " · Best <b>" + fmtWeight(best.weight) + " kg × " + best.reps + "</b>";
    }
    $("lastHint").innerHTML = html;
  }

  function prefillFromLast() {
    var last = lastSetFor(exSel.value);
    if (last) { weightIn.value = last.weight; repsIn.value = last.reps; }
  }

  // ---------- Trainingseinheit ----------
  var ticker = null;
  var MAX_SESSION_H = 6;   // laenger vergessene Einheiten werden automatisch beendet

  function fmtClock(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
  }

  // Unter drei Minuten ist die Angabe Rauschen – meist wurde die Einheit gleich
  // nach dem Start beendet. Eine offensichtlich falsche Dauer neben 14 Saetzen
  // ist schlechter als gar keine, deshalb leer statt "unter 1 Min".
  function fmtDauer(sec) {
    if (sec < 180) return "";
    var m = Math.round(sec / 60);
    if (m < 60) return m + " Min";
    var h = Math.floor(m / 60), r = m % 60;
    return h + " Std" + (r ? " " + r + " Min" : "");
  }

  // knappe Form fuer die Kachel
  function fmtDauerKurz(sec) {
    if (sec < 60) return "<1 Min";
    var m = Math.round(sec / 60);
    return m < 60 ? m + " Min" : Math.floor(m / 60) + ":" + pad(m % 60) + " h";
  }

  function sessionSecs() {
    return db.session ? Math.max(0, Math.floor((Date.now() - db.session.start) / 1000)) : 0;
  }

  function setsOfSession() {
    if (!db.session) return [];
    return db.sets.filter(function (s) { return s.ts >= db.session.start; });
  }

  function startSession() {
    db.session = { start: Date.now() };
    save();
    renderAll();
    startTicker();
    haptic();
    toast("Training gestartet", "good");
  }

  // Beendet die Einheit und schreibt die Dauer auf den Tag. Mehrere Einheiten
  // am selben Tag werden aufsummiert.
  function endSession(silent) {
    if (!db.session) return;
    var sets = setsOfSession();
    var sec = sessionSecs();
    // Eine Einheit zaehlt vollstaendig zu ihrem Starttag, auch ueber Mitternacht
    var k = dayKey(new Date(db.session.start));
    if (sets.length) {
      var w = db.workouts[k] || { sec: 0, start: db.session.start, end: 0 };
      w.sec += sec;
      w.start = Math.min(w.start || db.session.start, db.session.start);
      w.end = Date.now();
      db.workouts[k] = w;
      db.backup.due++;
    }
    stopRest();
    db.session = null;
    stopTicker();
    editingId = null;
    $("saveSet").textContent = "Satz speichern";
    $("editBar").innerHTML = "";
    save();
    renderAll();
    if (!silent) {
      haptic();
      var bilanz = [nSets(sets.length), fmtVolume(volume(sets))];
      if (fmtDauer(sec)) bilanz.unshift(fmtDauer(sec));
      toast(sets.length ? bilanz.join(" · ") : "Training verworfen", sets.length ? "good" : "");
    }
  }

  function startTicker() {
    stopTicker();
    ticker = setInterval(function () {
      var el = document.getElementById("sessionTime");
      if (!el) { stopTicker(); return; }
      el.textContent = fmtClock(sessionSecs());
    }, 1000);
  }
  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

  function renderSession() {
    var el = $("sessionArea");
    var card = $("inputCard");
    var bar = document.querySelector(".savebar");

    if (db.session) {
      var html = '<div class="sessionbar"><span class="live"></span>' +
        '<div class="txt"><b>Training läuft</b>' +
        '<span class="time" id="sessionTime">' + fmtClock(sessionSecs()) + '</span></div>' +
        '<button class="stop" id="endSession">Beenden</button></div>';
      var l = restLeft();
      if (l !== null) {
        html += '<div class="sessionbar resting' + (l <= 0 ? " over" : "") + '" id="restBar">' +
          '<button class="adj" type="button" data-rest="-30" aria-label="30 Sekunden weniger">−30</button>' +
          '<div class="cd"><b id="restTime">' + fmtClock(Math.max(0, l)) + '</b>' +
          '<small>Pause · Standard ' + db.settings.restSec + ' Sek</small></div>' +
          '<button class="adj" type="button" data-rest="30" aria-label="30 Sekunden mehr">+30</button>' +
          '<button class="stop" type="button" id="skipRest">Fertig</button></div>';
      }
      el.innerHTML = html;
      card.style.display = "";
      bar.style.display = "";
      return;
    }

    // Nachtrag: dieselbe Eingabe, nur mit festem Zieldatum statt laufender Uhr.
    if (nachtragDatum) {
      el.innerHTML = '<div class="sessionbar backfill">' + ICON_PLUS +
        '<div class="txt"><b>Nachtrag</b><span class="time">' +
        fmtDate(nachtragDatum) + '</span></div>' +
        '<button class="stop" type="button" id="endBackfill">Fertig</button></div>';
      card.style.display = "";
      bar.style.display = "";
      return;
    }

    // Ein vergangener Satz wird geaendert: nur das Formular, keine Startkarte.
    // Der Speichern-Pfad fuer editingId fasst db.session nicht an.
    if (editingId) {
      el.innerHTML = "";
      card.style.display = "";
      bar.style.display = "";
      return;
    }

    // keine Einheit aktiv – Startkarte, bei bereits erledigtem Training mit Bilanz
    card.style.display = "none";
    bar.style.display = "none";
    var k = todayKey();
    var w = db.workouts[k];
    var todaySets = db.sets.filter(function (s) { return s.date === k; });
    var check = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    // Erinnerung erscheint nach dem Training – Handy in der Hand, kein Satz gestoert
    var hinweis = backupFaellig()
      ? '<div class="backup"><svg viewBox="0 0 24 24"><path d="M12 3v11M8 10.5l4 4 4-4"/>' +
        '<path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>' +
        '<div class="t"><b>Sicherung fällig</b>' + db.backup.due +
        ' Trainings seit der letzten Sicherung</div>' +
        '<button type="button" id="backupNow">Sichern</button></div>'
      : "";

    // Auch ein nachgetragenes Training zaehlt als erledigt, obwohl es keine
    // gemessene Dauer hat – die Kachel entfaellt dann einfach.
    if (todaySets.length) {
      el.innerHTML = hinweis + '<div class="startcard">' +
        '<span class="done">' + check + 'Heute trainiert</span>' +
        '<div class="summary">' +
        (w && w.sec >= 180
          ? '<div><div class="v">' + fmtDauerKurz(w.sec) + '</div><div class="k">Dauer</div></div>'
          : '') +
        '<div><div class="v">' + todaySets.length + '</div><div class="k">' + (todaySets.length === 1 ? "Satz" : "Sätze") + '</div></div>' +
        '<div><div class="v">' + fmtVolume(volume(todaySets)) + '</div><div class="k">Volumen</div></div>' +
        '</div><button class="btn" id="startSession">Weiteres Training starten</button></div>';
    } else {
      el.innerHTML = hinweis + '<div class="startcard"><h2>Bereit?</h2>' +
        '<p>Starte die Einheit, um Sätze einzutragen.</p>' +
        '<button class="btn" id="startSession">Training starten</button></div>';
    }
  }

  // ---------- Pausentimer ----------
  var restTick = null, audioCtx = null;

  function restLeft() {
    if (!db.session || !db.session.restUntil) return null;
    return Math.round((db.session.restUntil - Date.now()) / 1000);
  }

  function startRest() {
    if (!db.session) return;
    db.session.restUntil = Date.now() + db.settings.restSec * 1000;
    save();
    renderSession();
    runRest();
  }

  function runRest() {
    if (restTick) clearInterval(restTick);
    restTick = setInterval(function () {
      var l = restLeft(), el = document.getElementById("restTime");
      if (l === null || !el) { clearInterval(restTick); restTick = null; return; }
      el.textContent = fmtClock(Math.max(0, l));
      var bar = document.getElementById("restBar");
      if (l <= 0 && bar && !bar.classList.contains("over")) {
        bar.classList.add("over");
        piep(); haptic();
      }
      if (l <= -25) endRest();   // nach einer Weile von selbst aufraeumen
    }, 250);
  }

  function stopRest() {
    if (restTick) { clearInterval(restTick); restTick = null; }
    if (db.session) delete db.session.restUntil;
  }

  function endRest() {
    stopRest();
    save();
    renderSession();
  }

  // ±30 Sek gilt fuer die laufende Pause und wird zugleich neuer Standard
  function adjustRest(delta) {
    db.settings.restSec = Math.min(600, Math.max(15, db.settings.restSec + delta));
    if (db.session && db.session.restUntil) {
      db.session.restUntil = Math.max(Date.now() + 1000, db.session.restUntil + delta * 1000);
    }
    save();
    renderSession();
    runRest();
    haptic();
  }

  // Ton nur als Zugabe: stummes iPhone oder Hintergrund verhindern ihn
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { /* ohne Ton weiter */ }
  }

  function piep() {
    if (!audioCtx) return;
    try {
      var t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.6);
    } catch (e) { /* rein optisch */ }
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    var a = e.target.closest("[data-rest]");
    if (a) { adjustRest(parseInt(a.dataset.rest, 10)); return; }
    if (e.target.closest("#skipRest")) endRest();
  });

  // Start/Beenden (delegiert, da die Karte neu gerendert wird)
  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest("#startSession")) { startSession(); return; }
    if (e.target.closest("#endSession")) {
      var n = setsOfSession().length;
      if (!n && !confirm("Training ohne eingetragene Sätze beenden?")) return;
      endSession();
    }
  });

  // Nach einer Pause (App geschlossen) weiterlaufen lassen bzw. aufraeumen
  function resumeSession() {
    if (!db.session) return;
    if (Date.now() - db.session.start > MAX_SESSION_H * 3600 * 1000) {
      var sets = setsOfSession();
      var last = sets.length ? sets[sets.length - 1].ts : db.session.start;
      var k = dayKey(new Date(db.session.start));
      if (sets.length) {
        var w = db.workouts[k] || { sec: 0, start: db.session.start, end: 0 };
        w.sec += Math.floor((last - db.session.start) / 1000);
        w.end = last;
        db.workouts[k] = w;
        db.backup.due++;
      }
      db.session = null;
      save();
      toast("Vergessenes Training beendet");
      return;
    }
    startTicker();
    if (restLeft() !== null) runRest();   // Pause laeuft nach Neustart weiter
  }

  // ---------- Stepper ----------
  document.querySelectorAll("[data-step]").forEach(function (b) {
    b.addEventListener("click", function () {
      var input = $(b.dataset.step);
      var delta = parseFloat(b.dataset.delta);
      var v = (parseFloat(input.value) || 0) + delta;
      var min = b.dataset.step === "reps" ? 1 : 0;
      input.value = Math.max(min, Math.round(v * 10) / 10);
      haptic();
    });
  });

  // ---------- Satz speichern ----------
  $("saveSet").addEventListener("click", function () {
    // Eine Korrektur braucht keine laufende Einheit, ein Nachtrag ebenfalls nicht.
    if (!db.session && !nachtragDatum && !editingId) { toast("Erst Training starten", "warn"); return; }
    var ex = exSel.value;
    if (!ex || ex === "__new__") { toast("Bitte Übung wählen", "warn"); return; }
    var w = parseFloat(weightIn.value);
    var r = parseInt(repsIn.value, 10);
    if (isNaN(w) || w < 0) { toast("Gewicht ungültig", "warn"); return; }
    if (isNaN(r) || r < 1) { toast("Wiederholungen ungültig", "warn"); return; }

    w = Math.round(w * 10) / 10;

    // Bestehenden Satz aendern: Zeitstempel und Position bleiben erhalten,
    // damit sich die Reihenfolge durch eine Korrektur nicht verdreht.
    if (editingId) {
      var alt = db.sets.filter(function (s) { return s.id === editingId; })[0];
      if (alt) { alt.exercise = ex; alt.weight = w; alt.reps = r; }
      cancelEdit();
      save();
      renderAll();
      haptic();
      toast("Satz geändert");
      return;
    }

    unlockAudio();
    var prevBest = bestFor(ex);
    // Starttag der Einheit, nicht der Kalendertag – sonst zerfaellt ein
    // Training ueber Mitternacht in zwei Trainingstage
    var tag = nachtragDatum || dayKey(new Date(db.session.start));
    // Beim Nachtrag gibt es keine echte Uhrzeit. Der Zeitstempel wird ab Mittag
    // des Zieltags fortgezaehlt, damit die Satzreihenfolge innerhalb des Tages
    // stimmt und der Satz nicht faelschlich als der aktuellste ueberhaupt gilt.
    var ts = Date.now();
    if (nachtragDatum) {
      var p = nachtragDatum.split("-");
      var basis = new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0).getTime();
      var vorhanden = db.sets.filter(function (s) { return s.date === tag; }).length;
      ts = basis + vorhanden * 1000;
    }
    db.sets.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      date: tag,
      ts: ts,
      exercise: ex,
      weight: w,
      reps: r
    });
    save();
    renderAll();
    haptic();
    if (!nachtragDatum) startRest();

    var isPR = !prevBest || w > prevBest.weight || (w === prevBest.weight && r > prevBest.reps);
    toast(isPR ? "Neue Bestleistung" : "Satz gespeichert", isPR ? "good" : "");
  });

  // ---------- Satz bearbeiten ----------
  var editingId = null;
  // Aus welcher Ansicht heraus geaendert wird – danach geht es dorthin zurueck,
  // sonst landet man nach einer Korrektur im Verlauf ploetzlich im Training.
  var editFrom = null;

  function startEdit(id) {
    var s = db.sets.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    editingId = id;
    editFrom = aktiveView();
    renderExercises(s.exercise);
    weightIn.value = s.weight;
    repsIn.value = s.reps;
    $("saveSet").textContent = "Satz ändern";
    // Bei einem vergangenen Satz das Datum nennen – sonst sieht man dem
    // Formular nicht an, welchen Tag man gerade korrigiert.
    var wann = s.date === todayKey() ? "" : " vom " + s.date.split("-").reverse().slice(0, 2).join(".");
    $("editBar").innerHTML = '<div class="editbar">' + esc(s.exercise) + wann +
      ' wird geändert<button type="button" id="cancelEdit">Abbrechen</button></div>';
    renderSession(); renderToday(); renderHistory();
    zeigeView("log");
    $("inputCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function cancelEdit() {
    if (!editingId) return;
    editingId = null;
    $("saveSet").textContent = "Satz speichern";
    $("editBar").innerHTML = "";
    renderSession(); renderToday(); renderHistory();
    if (editFrom && editFrom !== "log") zeigeView(editFrom);
    editFrom = null;
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest("#cancelEdit")) { cancelEdit(); return; }
    if (e.target.closest("[data-del]")) return;          // Loeschen hat Vorrang
    var row = e.target.closest(".setrow[data-id]");
    if (!row) return;
    if (!row.closest(".unlocked")) {
      toast(row.closest(".day") ? "Training erst freigeben" : "Ändern nur im laufenden Training", "warn");
      return;
    }
    if (editingId === row.dataset.id) cancelEdit();
    else startEdit(row.dataset.id);
  });

  // ---------- Übung umbenennen / löschen ----------
  function setzeGruppe(name) {
    openClassify(name);
  }

  function loescheUebung(name, anzahl) {
    if (anzahl) {
      alert("„" + name + "“ hat " + nSets(anzahl) + " und kann nicht gelöscht werden.\n" +
            "Sonst würdest du hierüber unbemerkt Historie vernichten.");
      return;
    }
    db.exercises = db.exercises.filter(function (n) { return n !== name; });
    delete db.groups[name];
    delete db.moves[name];
    save(); renderAll(); toast("Übung gelöscht");
  }

  function benenneUm(name) {
    var eingabe = prompt("Neuer Name für „" + name + "“:", name);
    if (eingabe === null) return;
    eingabe = eingabe.trim();
    if (!eingabe || eingabe === name) return;

    var kollision = allExercises().filter(function (n) {
      return n.toLowerCase() === eingabe.toLowerCase();
    })[0];
    if (kollision) {
      if (!confirm("„" + kollision + "“ gibt es bereits.\nBeide Historien zusammenführen?")) return;
      eingabe = kollision;
    }
    // Umbenennen nimmt Historie und Muskelgruppe mit; beim Zusammenführen
    // behaelt die Ziel-Uebung ihre Gruppe, sofern sie eine hat.
    db.sets.forEach(function (s) { if (s.exercise === name) s.exercise = eingabe; });
    db.exercises = db.exercises.filter(function (n) { return n !== name; });
    if (db.exercises.indexOf(eingabe) === -1) db.exercises.push(eingabe);
    if (!db.groups[eingabe] && db.groups[name]) db.groups[eingabe] = db.groups[name];
    if (!db.moves[eingabe] && db.moves[name]) db.moves[eingabe] = db.moves[name];
    delete db.groups[name];
    delete db.moves[name];
    save(); renderAll(); renderExercises(eingabe);
    toast(kollision ? "Zusammengeführt" : "Übung umbenannt");
  }

  $("manageExercise").addEventListener("click", function () {
    var name = exSel.value;
    if (!name || name === "__new__") { toast("Keine Übung gewählt", "warn"); return; }
    var anzahl = db.sets.filter(function (s) { return s.exercise === name; }).length;
    openSheet(name, groupName(db.groups[name] || "") + " · " + moveName(db.moves[name] || "") +
      " · " + nSets(anzahl), [
      { k: "grp", n: "Einordnen" },
      { k: "ren", n: "Umbenennen" },
      { k: "del", n: "Löschen" }
    ], function (aktion) {
      if (aktion === "grp") setzeGruppe(name);
      else if (aktion === "ren") benenneUm(name);
      else if (aktion === "del") loescheUebung(name, anzahl);
    });
  });

  // Die Daten liegen nur lokal – ohne Rueckgaengig waere ein Fehlgriff endgueltig.
  // Gemerkt wird auch die Position, sonst rutscht der Satz beim Wiederherstellen
  // ans Ende und die Reihenfolge innerhalb der Uebung stimmt nicht mehr.
  var undoSet = null;

  function deleteSet(id) {
    var i = -1;
    db.sets.forEach(function (s, n) { if (s.id === id) i = n; });
    if (i < 0) return;
    if (editingId === id) cancelEdit();
    undoSet = { satz: db.sets[i], pos: i };
    db.sets.splice(i, 1);
    save();
    renderAll();
    toast("Satz gelöscht", "", { label: "Rückgängig", fn: undoDelete, ms: 6000 });
  }

  function undoDelete() {
    if (!undoSet) return;
    db.sets.splice(Math.min(undoSet.pos, db.sets.length), 0, undoSet.satz);
    undoSet = null;
    save();
    renderAll();
    toast("Wiederhergestellt", "good");
  }

  // ---------- Rendering ----------
  // Gruppiert nach Übung, zuletzt trainierte zuerst. Die Sätze innerhalb einer
  // Gruppe bleiben chronologisch – gedreht wird erst beim Rendern, damit die
  // Satznummern stimmen.
  function groupByExercise(sets) {
    var order = [], map = {};
    sets.forEach(function (s) {
      if (!map[s.exercise]) { map[s.exercise] = []; order.push(s.exercise); }
      map[s.exercise].push(s);
    });
    return order.map(function (n) {
      var g = map[n];
      return { name: n, sets: g, last: g[g.length - 1].ts };
    }).sort(function (a, b) { return b.last - a.last; });
  }

  function volume(sets) {
    return sets.reduce(function (a, s) { return a + s.weight * s.reps; }, 0);
  }

  function nSets(n) { return n + (n === 1 ? " Satz" : " Sätze"); }

  // Gesamtvolumen kompakt: kg bis 1 t, danach Tonnen mit einer Nachkommastelle
  function fmtVolume(kg) {
    if (kg < 1000) return Math.round(kg) + " kg";
    var t = kg / 1000;
    return (t < 100 ? t.toFixed(1).replace(".", ",") : Math.round(t)) + " t";
  }

  function groupsHTML(sets) {
    return groupByExercise(sets).map(function (g) {
      return '<div class="exgroup"><h3>' + esc(g.name) +
        '<span class="pill">' + nSets(g.sets.length) + '</span></h3>' +
        g.sets.slice().reverse().map(function (s, i) {
          return '<div class="setrow' + (editingId === s.id ? " editing" : "") +
            '" data-id="' + s.id + '">' +
            '<div class="idx">' + (g.sets.length - i) + '</div>' +
            '<div class="load">' + fmtWeight(s.weight) + '<span class="u">kg</span></div>' +
            '<div class="times">×</div>' +
            '<div class="load">' + s.reps + '</div>' +
            '<button class="x" data-del="' + s.id + '" aria-label="Satz löschen">' + ICON_X + '</button>' +
            '</div>';
        }).join("") +
        '</div>';
    }).join("");
  }

  function renderToday() {
    var el = $("todayList");
    // Beim Aendern eines vergangenen Satzes waere eine "Heute"-Liste daneben
    // nur verwirrend – der Tab zeigt dann ausschliesslich das Formular.
    if (!db.session && !nachtragDatum && editingId) { el.innerHTML = ""; return; }
    // waehrend einer Einheit deren Starttag zeigen, beim Nachtrag das Zieldatum
    var tag = nachtragDatum || (db.session ? dayKey(new Date(db.session.start)) : todayKey());
    var sets = db.sets.filter(function (s) { return s.date === tag; });
    if (!sets.length) {
      // ohne laufende Einheit spricht schon die Startkarte – kein zweiter Hinweis
      el.innerHTML = (db.session || nachtragDatum) ? '<div class="empty">' +
        '<svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10"/></svg>' +
        '<p><b>Noch kein Satz</b>Trag deinen ersten Satz ein.</p></div>' : "";
      return;
    }
    // Waehrend die Einheit laeuft oder nachgetragen wird bleibt das Loeschkreuz
    // erreichbar – hier korrigiert man gerade eine Fehleingabe.
    el.innerHTML = '<div class="card flush' + (db.session || nachtragDatum ? " unlocked" : "") + '">' +
      '<div class="section-head"><h2>' + (nachtragDatum ? fmtDate(tag) : "Heute") +
      '</h2><span class="meta">' +
      nSets(sets.length) + ' · ' + fmtVolume(volume(sets)) + '</span></div>' +
      groupsHTML(sets) + '<div style="height:4px"></div></div>';
  }

  // Trainingstags entstehen aus den trainierten Uebungen, nicht aus Handarbeit:
  // Gruppen nach Volumenanteil, hoechstens drei genannt.
  // Push, wenn ueber 60 % des zugeordneten Volumens auf Druecken entfaellt.
  // Neutrales zaehlt nicht mit, sonst verwaessert ein Bauchtag jede Einheit.
  function moveTag(sets) {
    var p = 0, z = 0;
    sets.forEach(function (s) {
      var k = db.moves[s.exercise], v = s.weight * s.reps;
      if (k === "push") p += v; else if (k === "pull") z += v;
    });
    var g = p + z;
    if (!g) return "";
    if (p / g > 0.6) return "push";
    if (z / g > 0.6) return "pull";
    return "mixed";
  }

  // Uebungen des Tages. Dieselbe Reihenfolge wie die Bloecke im aufgeklappten
  // Zustand, sonst nennt die Vorschau eine andere Uebung zuerst als die Liste.
  function dayExercises(sets, max) {
    var namen = groupByExercise(sets).map(function (g) { return g.name; });
    var zeige = namen.slice(0, max).map(esc).join(" · ");
    return namen.length > max ? zeige + " +" + (namen.length - max) : zeige;
  }

  function renderHistory() {
    var el = $("historyList");
    var days = {};
    db.sets.forEach(function (s) { (days[s.date] = days[s.date] || []).push(s); });
    var keys = Object.keys(days).sort().reverse();
    var nachtragen = '<div class="addday"><button type="button">' +
      ICON_PLUS + 'Training nachtragen</button>' +
      '<input type="date" id="backfillDate" max="' + todayKey() +
      '" aria-label="Datum für den Nachtrag"></div>';
    if (!keys.length) {
      el.innerHTML = nachtragen + '<div class="empty">' +
        '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>' +
        '<p><b>Noch keine Trainings</b>Gespeicherte Tage erscheinen hier.</p></div>';
      return;
    }
    el.innerHTML = nachtragen + keys.map(function (k, i) {
      var sets = days[k];
      var w = db.workouts[k];
      var frei = editDay === k;
      var mv = moveTag(sets);
      // Reihenfolge wie besprochen: Bewegung, Datum, Uebungen, Kennzahlen –
      // jede Zeile eine Aufgabe, damit die Karten untereinander fluchten.
      var zahlen = [nSets(sets.length), fmtVolume(volume(sets))];
      var dauer = w && w.sec ? fmtDauer(w.sec) : "";
      if (dauer) zahlen.push(dauer);
      return '<details class="day' + (frei ? " unlocked" : "") + '"' +
        (i === 0 || frei ? " open" : "") + ' data-day="' + k + '">' +
        '<summary>' +
        (mv ? '<div class="daytags"><span class="mv ' + mv + '">' +
          (mv === "mixed" ? "Gemischt" : moveName(mv)) + '</span></div>' : '') +
        '<div class="dline"><span class="date">' + fmtDate(k) + '</span>' + ICON_CHEV + '</div>' +
        '<div class="exs">' + dayExercises(sets, 3) + '</div>' +
        '<div class="nums">' + zahlen.join(" · ") + '</div>' +
        '</summary>' +
        '<div class="body"><div class="lockbar">' +
        '<button type="button" class="lock" data-lock="' + k + '">' +
        '<span class="a">' + ICON_PEN + 'Bearbeiten</span>' +
        '<span class="b">' + ICON_OK + 'Fertig</span></button></div>' +
        groupsHTML(sets) +
        '<div class="addset"><button type="button" data-add="' + k + '">' +
        ICON_PLUS + 'Satz hinzufügen</button></div>' +
        '</div></details>';
    }).join("");
  }

  // ---------- Training nachtragen ----------
  // Bewusst nur im Speicher, nicht in der Datenbank: laedt die App neu, endet
  // der Modus. Schlimmstenfalls ist er weg – falsche Daten kann das nicht
  // erzeugen, weil ohne Modus und ohne Einheit gar nichts gespeichert wird.
  var nachtragDatum = null;

  function starteNachtrag(k) {
    if (db.session) { toast("Erst das laufende Training beenden", "warn"); return; }
    if (k > todayKey()) { toast("Kein Datum in der Zukunft", "warn"); return; }
    if (editingId) cancelEdit();
    nachtragDatum = k;
    renderSession(); renderToday(); renderHistory();
    zeigeView("log");
  }

  function endeNachtrag() {
    if (!nachtragDatum) return;
    nachtragDatum = null;
    renderSession(); renderToday(); renderHistory();
    zeigeView("history");
  }

  document.addEventListener("change", function (e) {
    if (!e.target.closest || !e.target.closest("#backfillDate")) return;
    var v = e.target.value;
    e.target.value = "";
    if (v) starteNachtrag(v);
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest("#endBackfill")) { endeNachtrag(); return; }
    var b = e.target.closest("[data-add]");
    if (b) starteNachtrag(b.dataset.add);
  });

  // ---------- Training zum Bearbeiten freigeben ----------
  // Hoechstens ein Tag ist gleichzeitig offen. editDay ist die Wahrheit fuers
  // Neuzeichnen, die Klasse am <details> die fuers laufende Umschalten.
  var editDay = null;

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-lock]") : null;
    if (!b) return;
    var k = b.dataset.lock;
    var auf = editDay !== k;
    editDay = auf ? k : null;
    document.querySelectorAll(".day").forEach(function (d) {
      d.classList.toggle("unlocked", auf && d.dataset.day === k);
    });
    haptic();
  });

  // Zuklappen sperrt wieder. toggle steigt nicht auf, daher in der Capture-Phase.
  document.addEventListener("toggle", function (e) {
    var d = e.target;
    if (!d.classList || !d.classList.contains("day") || d.open) return;
    d.classList.remove("unlocked");
    if (editDay === d.dataset.day) editDay = null;
  }, true);

  function renderStats() {
    var el = $("statsCard");

    // Nachtrag-Hinweis, damit kein unzugeordneter Bestand liegen bleibt
    var offen = ohneGruppe();
    var kopf = offen.length
      ? '<button class="untagged" type="button" id="assignNext">' +
        '<svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>' +
        '<div class="t"><b>' + offen.length +
        (offen.length === 1 ? " Maschine ohne Gruppe" : " Maschinen ohne Gruppe") + '</b>' +
        esc(offen.slice(0, 3).join(", ")) + (offen.length > 3 ? " …" : "") + '</div>' +
        '<span class="go">Zuordnen</span></button>'
      : "";

    if (!db.sets.length) {
      el.innerHTML = kopf + '<div class="empty">' +
        '<svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-4M3 20h18"/></svg>' +
        '<p><b>Noch keine Daten</b>Deine Bestleistungen erscheinen hier.</p></div>';
      return;
    }
    var days = {};
    db.sets.forEach(function (s) { days[s.date] = 1; });
    var byEx = {};
    db.sets.forEach(function (s) {
      var e = byEx[s.exercise] = byEx[s.exercise] || { count: 0, best: null, last: null };
      e.count++;
      if (!e.best || s.weight > e.best.weight || (s.weight === e.best.weight && s.reps > e.best.reps)) e.best = s;
      e.last = s;
    });
    var names = Object.keys(byEx).sort(function (a, b) { return byEx[b].count - byEx[a].count; });
    var nDays = Object.keys(days).length;

    el.innerHTML = kopf + '<div class="tiles">' +
        tile(nDays, nDays === 1 ? "Training" : "Trainings") +
        tile(db.sets.length, db.sets.length === 1 ? "Satz" : "Sätze") +
        tile(fmtVolume(volume(db.sets)), "Volumen") +
      '</div>' +
      '<div class="card flush"><div class="section-head"><h2>Bestleistungen</h2></div>' +
      names.map(function (n) {
        var e = byEx[n];
        return '<div class="statrow"><div class="nm">' + esc(n) +
          '<small>' + nSets(e.count) + ' · zuletzt ' +
          e.last.date.split("-").reverse().slice(0, 2).join(".") + '</small></div>' +
          '<div class="pr"><b>' + fmtWeight(e.best.weight) + ' kg</b>' +
          '<small>× ' + e.best.reps + '</small></div></div>';
      }).join("") + '<div style="height:6px"></div></div>';
  }

  function tile(v, label) {
    return '<div class="tile"><div class="v">' + v + '</div><div class="k">' + label + '</div></div>';
  }

  // ---------- Übersicht ----------
  // Volle Breite und quadratische Kacheln legen die Hoehe fest: Breite durch
  // Spalten mal sieben Zeilen. Flacher wird das Raster deshalb nur ueber mehr
  // Spalten – 26 Wochen ergeben 12px-Kacheln und rund 100 statt 207 px Hoehe.
  var HEAT_WEEKS = 26;

  function dayKey(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  // Wochenstart = Montag
  function weekStart(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }

  function addDays(d, n) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  }

  // Volumen je Trainingstag
  function volumeByDay() {
    var m = {};
    db.sets.forEach(function (s) { m[s.date] = (m[s.date] || 0) + s.weight * s.reps; });
    return m;
  }

  function renderOverview() {
    var el = $("overview");
    var vol = volumeByDay();

    var today = new Date();
    var curWeek = weekStart(today);
    var todayKey = dayKey(today);
    var html = "";

    // --- Kalenderraster ---
    var vals = Object.keys(vol).map(function (k) { return vol[k]; }).sort(function (a, b) { return a - b; });
    var med = vals.length ? vals[Math.floor(vals.length / 2)] : 0;
    function level(v) {
      if (!v) return "";
      if (!med) return " l4";
      if (v < med * 0.6) return " l1";
      if (v < med) return " l2";
      if (v < med * 1.5) return " l3";
      return " l4";
    }

    var firstWeek = addDays(curWeek, -7 * (HEAT_WEEKS - 1));
    var grid = "";
    for (var w = 0; w < HEAT_WEEKS; w++) {
      var ws = addDays(firstWeek, w * 7);
      for (var dd = 0; dd < 7; dd++) {
        var cd = addDays(ws, dd);
        var ck = dayKey(cd);
        var cls = cd > today ? "f" : level(vol[ck]).trim();
        if (ck === todayKey) cls += " t";
        grid += '<i class="' + cls + '"' +
          (vol[ck] ? ' title="' + ck + ': ' + Math.round(vol[ck]) + ' kg"' : "") + '></i>';
      }
    }

    html += '<div class="heat-wrap">' +
      '<div class="heat-grid">' + grid + '</div>' +
      '<div class="heat-legend">' +
      '<span class="sp">weniger</span>' +
      '<i style="background:rgba(255,255,255,.045)"></i>' +
      '<i style="background:rgba(204,255,77,.26)"></i>' +
      '<i style="background:rgba(204,255,77,.48)"></i>' +
      '<i style="background:rgba(204,255,77,.72)"></i>' +
      '<i style="background:var(--accent)"></i><span>mehr</span></div></div>';

    // --- letzte 30 Tage ---
    var since = addDays(today, -29);
    var recent = db.sets.filter(function (s) {
      var p = s.date.split("-");
      return new Date(+p[0], +p[1] - 1, +p[2]) >= since;
    });
    var rDays = {};
    recent.forEach(function (s) { rDays[s.date] = 1; });
    html += '<div class="section-head"><h2>Letzte 30 Tage</h2></div><div class="tiles">' +
      tile(Object.keys(rDays).length, "Trainings") +
      tile(recent.length, recent.length === 1 ? "Satz" : "Sätze") +
      tile(fmtVolume(volume(recent)), "Volumen") +
      '</div>';

    // --- Verteilung nach Muskelgruppen, aufgeschluesselt nach Bewegung ---
    var proGruppe = volumeByGroup(recent);
    var gesamt = volume(recent);
    if (gesamt > 0) {
      // Volumen je Gruppe, getrennt nach Push/Pull/Neutral/ohne Angabe.
      // Ein eigener Durchlauf statt einer Ableitung: eine Gruppe ist nicht
      // sortenrein, Beine enthalten Druecken und Ziehen.
      var mix = {};
      recent.forEach(function (s) {
        var g = db.groups[s.exercise] || "";
        var b = db.moves[s.exercise];
        b = b === "push" ? "push" : b === "pull" ? "pull" : b === "neutral" ? "neut" : "open";
        var e = mix[g] = mix[g] || { push: 0, pull: 0, neut: 0, open: 0 };
        e[b] += s.weight * s.reps;
      });

      var zeilen = GROUPS.map(function (g) {
        return { n: g.n, k: g.k, v: proGruppe[g.k] || 0 };
      });
      if (proGruppe[""]) zeilen.push({ n: "Nicht zugeordnet", k: "", v: proGruppe[""] });
      zeilen.sort(function (a, b) { return b.v - a.v; });
      var max = zeilen[0].v || 1;

      html += '<div class="card"><div class="section-head"><h2>Verteilung</h2>' +
        '<span class="key"><span><i class="push"></i>' + moveName("push") + '</span>' +
