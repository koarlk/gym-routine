        '<span><i class="pull"></i>' + moveName("pull") + '</span></span></div>';

      html += '<div class="dist">' +
        zeilen.map(function (z) {
          var pct = Math.round(z.v / gesamt * 100);
          var m = mix[z.k] || { push: 0, pull: 0, neut: 0, open: 0 };
          // Segmentbreiten in Prozent der Gruppe, nicht des Gesamtvolumens
          var seg = z.v
            ? ["push", "pull", "neut", "open"].filter(function (c) { return m[c] > 0; })
                .map(function (c) {
                  return '<i class="' + c + '" style="width:' + (m[c] / z.v * 100) + '%"></i>';
                }).join("")
            : "";
          return '<div class="row' + (z.v ? "" : " zero") + '">' +
            '<div class="nm">' + z.n + '</div>' +
            '<div class="track"><div class="fill" style="width:' +
            (z.v ? Math.max(3, Math.round(z.v / max * 100)) : 0) + '%">' + seg + '</div></div>' +
            '<div class="pct">' + (z.v ? pct + " %" : "–") + '</div></div>';
        }).join("");
      var offen = ohneGruppe().length;
      html += offen
        ? '<span class="hint">' + offen + (offen === 1 ? " Maschine ist" : " Maschinen sind") +
          ' noch keiner Gruppe zugeordnet – ihr Volumen läuft unter „Nicht zugeordnet“.</span>'
        : "";
      html += '</div></div>';
    }

    el.innerHTML = html;
  }


  function renderAll() {
    renderExercises();
    renderSession();
    renderToday();
    renderOverview();
    renderHistory();
    renderStats();
    var days = {};
    db.sets.forEach(function (s) { days[s.date] = 1; });
    var n = Object.keys(days).length;
    $("headerSub").textContent = n ? n + (n === 1 ? " Training" : " Trainings") : "";
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Löschen (delegiert, für beide Listen)
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-del]") : null;
    if (b) deleteSet(b.dataset.del);
  });

  // ---------- Navigation ----------
  function aktiveView() {
    var b = document.querySelector("nav button.active");
    return b ? b.dataset.view : "overview";
  }

  function zeigeView(name) {
    document.querySelectorAll("nav button").forEach(function (x) {
      x.classList.toggle("active", x.dataset.view === name);
    });
    document.querySelectorAll(".view").forEach(function (x) {
      x.classList.toggle("active", x.id === "view-" + name);
    });
    window.scrollTo(0, 0);
  }

  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      // Die Freigabe endet beim Verlassen der Ansicht. Ausnahme: eine Aenderung
      // ist noch offen – die fuehrt selbst in den Training-Tab und braucht den
      // freigegebenen Tag noch, um danach dorthin zurueckzukehren.
      if (!editingId && editDay) { editDay = null; renderHistory(); }
      zeigeView(b.dataset.view);
    });
  });

  // ---------- Sicherung ----------
  // Fuehrt eine Datei mit dem Bestand zusammen: fehlende Saetze kommen dazu,
  // vorhandene bleiben. Ein alter Stand kann so nie Neueres vernichten.
  function mergeIn(d) {
    var bekannt = {};
    db.sets.forEach(function (s) { bekannt[s.id] = 1; });
    var neu = 0;
    d.sets.forEach(function (s) {
      if (!s || !s.id || bekannt[s.id]) return;
      if (typeof s.weight !== "number" || typeof s.reps !== "number" || !s.date) return;
      db.sets.push(s); bekannt[s.id] = 1; neu++;
    });
    db.sets.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });

    var da = {};
    db.exercises.forEach(function (n) { da[n.toLowerCase()] = 1; });
    (Array.isArray(d.exercises) ? d.exercises : []).concat(
      db.sets.map(function (s) { return s.exercise; })
    ).forEach(function (n) {
      if (n && !da[n.toLowerCase()]) { db.exercises.push(n); da[n.toLowerCase()] = 1; }
    });

    // Dauern nur fuer Tage ergaenzen, die noch keine haben
    var wo = (d.workouts && typeof d.workouts === "object") ? d.workouts : {};
    Object.keys(wo).forEach(function (k) { if (!db.workouts[k]) db.workouts[k] = wo[k]; });

    // Zuordnungen ebenso: eine alte Datei ueberschreibt keine neuere Gruppe
    var gr = (d.groups && typeof d.groups === "object") ? d.groups : {};
    Object.keys(gr).forEach(function (n) { if (!db.groups[n]) db.groups[n] = gr[n]; });
    var mv = (d.moves && typeof d.moves === "object") ? d.moves : {};
    Object.keys(mv).forEach(function (n) { if (!db.moves[n]) db.moves[n] = mv[n]; });
    return neu;
  }

  function backupFaellig() { return db.backup.due >= BACKUP_FAELLIG; }

  function exportDaten() {
    var kopie = {
      sets: db.sets, exercises: db.exercises, settings: db.settings,
      workouts: db.workouts, groups: db.groups, moves: db.moves, v: db.v
    };
    var json = JSON.stringify(kopie, null, 2);
    var name = "gym-backup-" + todayKey() + ".json";
    var fertig = function () {
      db.backup = { at: Date.now(), due: 0 };
      save(); renderAll(); toast("Gesichert", "good");
    };
    // Teilen-Menue: legt die Datei direkt in iCloud Drive ab
    try {
      var file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).then(fertig).catch(function () { /* abgebrochen */ });
        return;
      }
    } catch (e) { /* File/Share nicht verfuegbar – Download unten */ }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    fertig();
  }

  $("exportBtn").addEventListener("click", exportDaten);
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("#backupNow")) exportDaten();
  });

  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.sets)) throw new Error("bad");
        var neu = mergeIn(d);
        save(); renderAll();
        toast(neu ? neu + (neu === 1 ? " Satz ergänzt" : " Sätze ergänzt") : "Nichts Neues in der Datei",
              neu ? "good" : "");
      } catch (err) {
        toast("Datei nicht lesbar", "warn");
      }
    };
    r.readAsText(f);
    e.target.value = "";
  });

  $("wipeBtn").addEventListener("click", function () {
    if (!confirm("Wirklich ALLE Trainingsdaten löschen? Das lässt sich nicht rückgängig machen.")) return;
    if (!confirm("Sicher? Exportiere vorher ein Backup, falls du die Daten behalten willst.")) return;
    var behalten = db.settings;
    db = leer();
    db.settings = behalten;
    stopTicker(); stopRest();
    editingId = null; editDay = null; undoSet = null; nachtragDatum = null;
    save(); renderAll(); toast("Alle Daten gelöscht");
  });

  // ---------- Feedback ----------
  var toastTimer;
  function toast(msg, kind, aktion) {
    var t = $("toast");
    t.textContent = msg;
    if (aktion) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "undo";
      b.textContent = aktion.label;
      b.addEventListener("click", function () {
        clearTimeout(toastTimer);
        t.className = "toast";
        aktion.fn();
      });
      t.appendChild(b);
    }
    t.className = "toast show" + (kind ? " " + kind : "") + (aktion ? " act" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = "toast"; }, aktion ? aktion.ms : 1900);
  }
  function haptic() { if (navigator.vibrate) navigator.vibrate(8); }

  // ---------- Service Worker (nur ueber http/https, nicht bei file://) ----------
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline-Modus optional */ });
    });
  }

  // ---------- Start ----------
  resumeSession();
  save();          // Migration und normalisierte Einstellungen festschreiben
  renderAll();
  var lu = lastUsedExercise();
  if (lu) { renderExercises(lu); prefillFromLast(); }
})();
</script>
</body>
</html>
